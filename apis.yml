name: IControl Networks
description: 'IControl Networks was a smart-home and home-security platform company (OpenHome / Connect,
  Piper) backed by Kleiner Perkins. It was acquired by Comcast in 2017 (the platform underpinned Xfinity
  Home) with its residential SaaS business sold to Alarm.com; it no longer operates as an independent
  entity. Enrichment probe (2026-07-20): the icontrol.com domain no longer serves a website and is now
  delegated to Comcast nameservers (dns10x.comcast.net); icontrolnetworks.com, developer.icontrol.com,
  and api.icontrol.com do not resolve. No live developer portal, documentation, or public API surface
  exists to harvest. Sector: hardtech / IoT.'
